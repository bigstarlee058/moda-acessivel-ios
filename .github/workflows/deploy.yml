name: Build e Deploy iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar versao do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Instalar chave API do App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Criar ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Instalar CocoaPods
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Compilar e Enviar para App Store Connect
        run: |
          xcodebuild -workspace "Moda Acessível.xcworkspace" \
                     -scheme "Moda Acessível" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/ModaAcessivel.xcarchive archive \
                     DEVELOPMENT_TEAM=W5399G3VHK \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 \
                     ALLOW_PROVISIONING_AUTO_APPROVED=YES

          xcodebuild -exportArchive \
                     -archivePath $PWD/build/ModaAcessivel.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $PWD/build/out \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

          xcrun altool --upload-app \
                       --type ios \
                       --file $PWD/build/out/*.ipa \
                       --apiKey ${{ secrets.APP_STORE_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_ISSUER_ID }}
