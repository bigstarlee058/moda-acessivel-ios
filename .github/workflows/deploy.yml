name: Build e Deploy iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar versão do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Instalar Chave API do App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Configurar Keychain e Instalar Certificado/Perfil
        run: |
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          echo "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | tr -d '\n' | base64 --decode > certificate.p12
          security import certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.P12_PASSWORD }}" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | tr -d '\n' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Ajustar Podfile e Desativar Assinatura dos Pods
        run: |
          python3 -c "
          path = 'Podfile'
          with open(path, 'r') as f:
              content = f.read()
          if 'post_install do |installer|' in content:
              content = content.split('post_install do |installer|')[0]
          new_post_install = '''
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          '''
          with open(path, 'w') as f:
              f.write(content + '\n' + new_post_install)
          "

      - name: Instalar Dependências CocoaPods
        run: |
          pod repo update
          pod install --repo-update

      - name: Criar ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>teamID</key>
              <string>W5399G3VHK</string>
          </dict>
          </plist>
          EOF

      - name: Compilar e Gerar Archive
        run: |
          xcodebuild archive \
                     -workspace "Moda Acessível.xcworkspace" \
                     -scheme "Moda Acessível" \
                     -destination "generic/platform=iOS" \
                     -configuration Release \
                     -archivePath $PWD/build/ModaAcessivel.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=W5399G3VHK

      - name: Exportar e Assinar IPA para App Store
        run: |
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/ModaAcessivel.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $PWD/build/out

      - name: Upload para App Store Connect
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file $PWD/build/out/*.ipa \
                       --apiKey ${{ secrets.APP_STORE_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_ISSUER_ID }}
